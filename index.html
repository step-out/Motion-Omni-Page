<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion-Omni: End-to-End Joint Speech and Full-Body Motion for Spoken Dialogue</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2430; --ink2:#5b6675; --ink3:#8a95a3;
  --line:#e3e7ed; --accent:#2f6bd8; --accent-soft:#eef3fd;
  --best:#1a7f4b; --best-bg:#e8f6ee; --ours:#f7f9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* header */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:56px 0 44px;text-align:center}
h1{font-size:33px;line-height:1.28;font-weight:680;letter-spacing:-.4px;max-width:830px;margin:0 auto}
h1 .brand{color:var(--accent)}
.venue{margin-top:16px;color:var(--ink2);font-size:15px}
.authors{margin-top:20px}
/* Names and affiliations sit on separate lines; wide inline gaps let a long
   author list wrap sensibly on narrow screens instead of overflowing. */
.names{font-size:16.5px;color:var(--ink)}
.names .au{display:inline-block;margin:0 13px 3px}
.names sup{font-size:.66em;color:var(--accent);font-weight:600}
.affs{margin-top:7px;font-size:13.5px;color:var(--ink2)}
.affs .af{display:inline-block;margin:0 10px 2px}
.affs sup{font-size:.72em;color:var(--accent);font-weight:600;margin-right:1px}
.cor{margin-top:9px;font-size:12.5px;color:var(--ink3)}
.links{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 19px;border-radius:8px;
  background:var(--ink);color:#fff;text-decoration:none;font-size:14.5px;font-weight:550;
  border:1px solid var(--ink);transition:.16s}
.btn:hover{background:#2f3d4f}
.btn.ghost{background:var(--panel);color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.off{background:#eef0f4;color:var(--ink3);border-color:var(--line);cursor:not-allowed}
.btn.off:hover{background:#eef0f4;color:var(--ink3)}
.btn .ic{font-size:15px}

/* sections */
section{padding:52px 0}
section+section{border-top:1px solid var(--line)}
h2{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--accent);text-align:center}
.lead{max-width:820px;margin:22px auto 0;font-size:16.5px;line-height:1.82;color:#33404f;text-align:justify}
.lead em{color:var(--ink);font-style:italic}
.lead strong{font-weight:640}

/* highlights */
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:15px;
  max-width:900px;margin:34px auto 0}
.hlc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:19px 17px;text-align:center}
.hlv{font-size:27px;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.hlk{font-size:13px;font-weight:600;margin-top:6px}
.hln{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.45}

/* figure */
figure{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;margin-top:30px}
figure img{width:100%;display:block;border-radius:5px}
figcaption{margin-top:14px;font-size:13.5px;color:var(--ink2);text-align:center;line-height:1.6}
figcaption b{color:var(--ink)}

/* tables */
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px 22px 22px;margin-top:26px;overflow-x:auto}
.tcap{font-size:13.5px;color:var(--ink2);line-height:1.62;margin-bottom:16px}
.tcap b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 11px;text-align:right;border-bottom:1px solid #eef1f5;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12.5px;font-weight:650;color:var(--ink2);border-bottom:1.5px solid #d7dde5;
  text-transform:none;letter-spacing:.2px}
thead tr.grp th{border-bottom:1px solid var(--line);color:var(--accent);
  font-size:11.5px;letter-spacing:1px;text-transform:uppercase;text-align:center;padding-bottom:5px}
tbody tr:last-child td{border-bottom:none}
tr.sub td{font-style:italic;color:var(--ink3);font-size:13px;padding:13px 11px 5px;border-bottom:none}
tr.ours{background:var(--ours)}
tr.ours td{font-weight:640}
tr.ours td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.teacher td:first-child{color:var(--ink2)}
tr.total td{font-weight:640;border-top:1.5px solid #d7dde5}
.b1{color:var(--best);font-weight:700;background:var(--best-bg);border-radius:4px;padding:1px 6px}
.b2{text-decoration:underline;text-decoration-color:#b9c3d0;text-underline-offset:3px}
.note{font-size:12.5px;color:var(--ink3);margin-top:13px;line-height:1.6}

/* demos */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(292px,1fr));gap:20px;margin-top:30px}
/* Same-audio comparison: one row per case.  Ours and one baseline sit side by
   side and play together off the same response audio, so the motion is the only
   thing that differs.  Tabs swap which baseline occupies the right pane. */
.cmp{display:flex;flex-direction:column;gap:26px;margin-top:28px}
.cmprow{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px 20px}
.cmpq{font-size:14.5px;font-weight:600;line-height:1.5}
.cmpa{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.62}
.deckwrap{margin-top:16px}
/* Two panes side by side: ours on the left, the selected baseline on the right.
   Both clips come from the same response audio and are the same length, so the
   pair plays in lockstep and the only visible difference is the motion. */
.pairouter{display:flex;justify-content:center}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
  width:min(620px,100%)}
.pane{min-width:0}
.phead{display:flex;align-items:baseline;justify-content:center;gap:7px;
  flex-wrap:wrap;min-height:19px;margin-bottom:7px}
.pane video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;
  background:#101418;border:1px solid var(--line);border-radius:10px}
.pane.ours video{border-color:var(--accent)}
/* The baseline is muted and has no controls of its own: the audio is identical,
   so two live tracks would only echo.  Clicking it drives the pair instead. */
.pane.base video{cursor:pointer}
.pname{font-size:13.5px;font-weight:650}
.pane.ours .pname{color:var(--accent)}
.pnote{font-size:11.5px;color:var(--ink3)}
.psub{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5}
.pairhint{text-align:center;font-size:11px;color:var(--ink3);margin-top:9px}
@media(max-width:620px){.pair{grid-template-columns:1fr;gap:16px}}
/* Per-clip observation.  Hidden unless the manifest carries a note for this
   case + system pair, so decks without a note keep their current height. */
.deckobs{display:none;max-width:620px;margin:11px auto 0;padding:6px 10px;
  font-size:11.5px;line-height:1.55;text-align:left;color:var(--ink2);
  background:#fbfbfc;border:1px solid var(--line);border-left:2px solid #c98a2e;border-radius:3px}
.deckobs.show{display:block}
.deckobs b{display:block;font-weight:600;color:var(--ink3);font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.decknav{display:flex;align-items:center;justify-content:center;gap:6px;
  flex-wrap:wrap;margin-top:13px}
.dtab,.dnav{font:inherit;font-size:11.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;
  transition:.16s;line-height:1.5}
.dnav{padding:3px 9px;font-size:14px;color:var(--ink3)}
.dtab:hover,.dnav:hover{border-color:var(--accent);color:var(--accent)}
.dtab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  transition:.18s}
.card:hover{border-color:#b9cdf0;box-shadow:0 5px 20px rgba(30,50,90,.09)}
video{width:100%;display:block;background:#101418;aspect-ratio:9/16;object-fit:cover}
.cb{padding:15px 17px 17px}
.cno{font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--accent)}
.cq{font-size:14px;font-weight:600;margin-top:7px;line-height:1.48}
.ca{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.66}
.ct{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.tg{font-size:11.5px;padding:3px 9px;border-radius:5px;background:#f1f4f8;
  color:var(--ink2);border:1px solid #e5eaf1}
.tg.ok{background:var(--best-bg);color:var(--best);border-color:#c8e6d5}

/* bibtex */
pre{background:#f4f6f9;border:1px solid var(--line);border-radius:9px;padding:17px 19px;
  overflow-x:auto;font:13px/1.72 ui-monospace,SFMono-Regular,Menlo,monospace;color:#39485a;
  margin-top:22px}
footer{padding:38px 0 52px;text-align:center;color:var(--ink3);font-size:13px;
  border-top:1px solid var(--line)}
@media(max-width:640px){h1{font-size:25px}section{padding:38px 0}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 id="ttl"></h1>
    <div class="venue" id="venue"></div>
    <div class="authors" id="authors"></div>
    <div class="links" id="links"></div>
  </div>
</header>

<section>
  <div class="wrap">
    <h2>Abstract</h2>
    <p class="lead" id="abs"></p>
    <div class="hl" id="hl"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>Video Samples</h2>
    <div id="cmpkey"></div>
    <div class="cmp" id="grid"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>Framework</h2>
    <figure>
      <img src="assets/architecture.png" alt="Motion-Omni framework">
      <figcaption id="arch"></figcaption>
    </figure>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>Results</h2>
    <div id="tables"></div>
    <figure>
      <img src="assets/quality_latency.png" alt="Motion quality vs response latency"
           style="max-width:760px;margin:0 auto">
      <figcaption id="ql"></figcaption>
    </figure>
  </div>
</section>

<section>
  <div class="wrap">
    <h2>BibTeX</h2>
    <pre id="bib"></pre>
  </div>
</section>

<footer id="foot"></footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// mark: 1 = best, 2 = second best
const mk = (v, m) => m === 1 ? `<span class="b1">${v}</span>`
                 : m === 2 ? `<span class="b2">${v}</span>` : v;

// no-store: the dev server sends no Cache-Control, so a browser would otherwise
// serve a heuristically-fresh manifest and render content the page no longer
// matches.  The file is small, so always taking it from the network is cheap.
fetch('manifest.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  const p = d.paper, it = d.items || [];

  /* ---- header ---- */
  document.getElementById('ttl').innerHTML =
    esc(p.title).replace('Motion-Omni', '<span class="brand">Motion-Omni</span>');
  // Empty venue renders nothing at all, so the line stays out of the way until
  // there is a real venue to announce.
  const venueEl = document.getElementById('venue');
  if (p.venue) venueEl.textContent = p.venue;
  else venueEl.style.display = 'none';
  // Names on one line, affiliations on the next, linked by superscript numbers.
  // Identical affiliations collapse onto one number, so adding a co-author from
  // an existing institution does not duplicate it in the second line.
  // Role marker matches the paper: * corresponding author. (The ICLR style sets
  // \thefootnote to \fnsymbol, so the paper's single \thanks renders as *, not †.)
  const affs = [];
  (p.authors || []).forEach(a => { if (!affs.includes(a.aff)) affs.push(a.aff); });
  const nameLine = (p.authors || []).map(a => {
    const roles = a.corresponding ? '*' : '';
    return `<span class="au">${esc(a.name)}<sup>${affs.indexOf(a.aff) + 1}` +
           `${roles ? ',' + roles : ''}</sup></span>`;
  }).join('');
  const affLine = affs.map((aff, i) =>
    `<span class="af"><sup>${i + 1}</sup>${esc(aff)}</span>`).join('');
  const notes = [];
  if ((p.authors || []).some(a => a.corresponding)) notes.push('<sup>*</sup>Corresponding author');
  const note = notes.length ? `<div class="cor">${notes.join(' &nbsp;&middot;&nbsp; ')}</div>` : '';
  document.getElementById('authors').innerHTML =
    `<div class="names">${nameLine}</div><div class="affs">${affLine}</div>${note}`;

  const L = [
    ['arxiv', 'arXiv', '📄'], ['pdf', 'Paper', '📕'],
    ['code', 'Code', '💻'], ['bibtex', 'BibTeX', '❞']
  ];
  document.getElementById('links').innerHTML = L.map(([k, label, ic]) => {
    if (k === 'bibtex')
      return `<a class="btn ghost" href="#bib"><span class="ic">${ic}</span>${label}</a>`;
    const u = p[k];
    return u
      ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener"><span class="ic">${ic}</span>${label}</a>`
      : `<span class="btn off" title="Coming soon"><span class="ic">${ic}</span>${label}</span>`;
  }).join('');

  /* ---- abstract + highlights ---- */
  document.getElementById('abs').innerHTML = p.abstract;
  document.getElementById('hl').innerHTML = p.highlights.map(h =>
    `<div class="hlc"><div class="hlv">${h.v}</div>
     <div class="hlk">${esc(h.k)}</div><div class="hln">${esc(h.n)}</div></div>`).join('');
  document.getElementById('arch').innerHTML = `<b>Figure 1.</b> ${esc(p.arch_caption)}`;

  /* ---- tables ---- */
  const out = [];

  // speech
  const s = p.speech;
  out.push(`<div class="tbl"><div class="tcap"><b>Table 1.</b> ${s.caption}</div>
    <table><thead><tr>${s.cols.map((c, i) =>
      `<th>${esc(c)}${i ? ' ↓' : ''}</th>`).join('')}</tr></thead><tbody>` +
    s.groups.map(([g, rows]) =>
      `<tr class="sub"><td colspan="2">${esc(g)}</td></tr>` +
      rows.map(([n, v, m]) => {
        const ours = n.includes('ours');
        return `<tr class="${ours ? 'ours' : ''}"><td>${esc(n)}</td><td>${mk(v, m)}</td></tr>`;
      }).join('')
    ).join('') + `</tbody></table></div>`);

  // motion
  const mo = p.motion;
  out.push(`<div class="tbl"><div class="tcap"><b>Table 2.</b> ${mo.caption}</div>
    <table>
    <thead>
      <tr class="grp"><th></th><th colspan="5">Reference-free</th><th colspan="3">Teacher-referenced</th></tr>
      <tr>${mo.cols.map((c, i) => `<th>${esc(c)} ${mo.arrows[i]}</th>`).join('')}</tr>
    </thead><tbody>` +
    mo.rows.map((r, ri) => {
      const cls = ri === mo.ours_row ? 'ours' : (mo.teacher_rows.includes(ri) ? 'teacher' : '');
      return `<tr class="${cls}"><td>${esc(r[0])}</td>` +
        r.slice(1).map(([v, m]) => `<td>${mk(v, m)}</td>`).join('') + `</tr>`;
    }).join('') +
    `</tbody></table>
     <div class="note">Rows in grey run the LOM motion teacher at inference time, which the
      teacher-referenced columns structurally favour.</div></div>`);

  // latency
  const la = p.latency;
  out.push(`<div class="tbl"><div class="tcap"><b>Table 3.</b> ${la.caption}</div>
    <table><thead><tr>${la.cols.map((c, i) =>
      `<th>${esc(c)}${i && i < 3 ? ' ↓' : ''}</th>`).join('')}</tr></thead><tbody>` +
    la.rows.map((r, ri) =>
      `<tr class="${ri === la.ours_row ? 'ours' : ''}"><td>${esc(r[0])}</td>` +
      r.slice(1).map(([v, m]) => `<td>${mk(v, m)}</td>`).join('') + `</tr>`).join('') +
    `</tbody></table></div>`);

  // data
  const da = p.data;
  out.push(`<div class="tbl"><div class="tcap"><b>Table 4.</b> ${da.caption}</div>
    <table><thead><tr>${da.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
    da.rows.map((r, ri) =>
      `<tr class="${ri === da.rows.length - 1 ? 'total' : ''}">` +
      r.map(c => `<td>${esc(c)}</td>`).join('') + `</tr>`).join('') +
    `</tbody></table></div>`);

  document.getElementById('tables').innerHTML = out.join('');
  document.getElementById('ql').innerHTML =
    `<b>Figure 2.</b> ${esc(p.ql_caption)}`;

  /* ---- demos: ours beside one baseline per case, both on the same audio ---- */
  const cmp = d.comparison;

  /* Corpus-level numbers come from Tables 3-5 (500 clips). Per-clip figures are
     deliberately not shown: six clips are too few to reproduce a corpus
     statistic, and quoting a subset value that disagrees with the paper would
     undercut the very comparison this section is making. */
  if (cmp) {
    const head = ['', 'BC<sub>bi</sub> ↑', 'Diversity ↑', 'RTF ↓', 'Slowdown',
                  'Human pref. W/T/L'];
    const body = [[cmp.ours.label, cmp.ours.paper_bc, cmp.ours.paper_div,
                   cmp.ours.paper_rtf, cmp.ours.paper_slowdown, cmp.ours.paper_pref || '—']]
      .concat(cmp.baselines.map(b =>
        [b.label, b.paper_bc, b.paper_div, b.paper_rtf, b.paper_slowdown,
         b.paper_pref || '—']));
    document.getElementById('cmpkey').innerHTML =
      `<div class="tbl" style="margin-top:22px">
        <div class="tcap"><b>Reference numbers</b> — measured over all 500 SwDA-500 clips
         (Tables 3–5), not over these six. Human preference is ours versus that baseline,
         wins/ties/losses pooled over rhythm, semantics and naturalness.</div>
        <table><thead><tr>${head.map((c, i) =>
          `<th${i ? '' : ' style="text-align:left"'}>${c}</th>`).join('')}</tr></thead>
        <tbody>${body.map((r, ri) =>
          `<tr class="${ri === 0 ? 'ours' : ''}">` +
          r.map((c, i) => `<td${i ? '' : ' style="text-align:left"'}>${esc(c)}</td>`).join('') +
          `</tr>`).join('')}</tbody></table>
      </div>`;
  }

  /* One row per case.  `ours` holds the left pane; `baselines` are what the tabs
     swap into the right pane.  Latency is deliberately not surfaced here -- the
     paper reports it, and repeating it beside every clip only invites the reader
     to weigh speed instead of watching the motion. */
  const ours = {
    key: 'ours',
    label: (cmp && cmp.ours.label) || 'Ours',
    note: 'single pass',
    thumb_dir: 'thumbs',
    src: v => 'videos/' + encodeURIComponent(v.video)
  };
  const bases = (cmp ? cmp.baselines : []).map(b => ({
    key: b.key,
    label: b.label,
    note: 'separate stage',
    thumb_dir: b.thumb_dir,
    src: v => b.video_dir + '/' + encodeURIComponent(v.name) + '.mp4'
  }));
  // tabs are narrow: drop the shared "MO-audio + " prefix.  The full label still
  // sits above the pane, so nothing is lost.
  const tabName = s => s.label.replace(/^MO-audio \+\s*/, '');

  /* Cases flagged `hide` in the manifest are dropped here but kept in the data,
     so putting one back is a manifest edit rather than a code change.
     `i` stays the manifest position because `data-row` indexes `it` for the
     per-clip note; `n` is the position among visible cases, so the SAMPLE
     labels read 01, 02, ... with no gap where a hidden case used to be. */
  document.getElementById('grid').innerHTML = it
    .map((v, i) => [v, i])
    .filter(([v]) => !v.hide)
    .map(([v, i], n) => {
    /* preload="none" keeps the poster visible without fetching the media up
       front; the pair is only two clips, so they load on first play.
       The baseline is muted and control-less on purpose: it carries the same
       audio as ours, so a second live track would just echo. */
    const panes = `
      <div class="pane ours">
        <div class="phead"><span class="pname">${esc(ours.label)}</span>
          <span class="pnote">${esc(ours.note)}</span></div>
        <video class="vours" src="${esc(ours.src(v))}"
               poster="${esc(ours.thumb_dir)}/${encodeURIComponent(v.name)}.jpg"
               controls preload="none" playsinline></video>
      </div>
      <div class="pane base">
        <div class="phead"><span class="pname"></span><span class="pnote"></span></div>
        <video class="vbase" preload="metadata" playsinline muted></video>
      </div>`;
    const tabs = bases.map((s, si) =>
      `<button class="dtab" data-si="${si}">${esc(tabName(s))}</button>`).join('');
    return `<div class="cmprow" data-row="${i}">
      <div class="cno">SAMPLE ${String(n + 1).padStart(2, '0')}</div>
      <div class="cmpq">${esc(v.question)}</div>
      <div class="cmpa">${esc(v.answer)}</div>
      <div class="deckwrap">
        <div class="pairouter"><div class="pair">${panes}</div></div>
        <div class="pairhint">Press play once \u2014 both clips run together on the
          same response audio.</div>
        <div class="deckobs"></div>
        <div class="decknav">
          <button class="dnav" data-d="-1" aria-label="previous baseline">&lsaquo;</button>
          ${tabs}
          <button class="dnav" data-d="1" aria-label="next baseline">&rsaquo;</button>
        </div>
      </div>
    </div>`;
  }).join('');

  /* ---- pair behaviour ---- */
  /* The right pane follows the tabs.  Swapping baselines mid-playback keeps the
     current position so the reader compares the same moment, rather than being
     thrown back to the start. */
  function layout(row) {
    const si = +row.dataset.active;
    const s = bases[si];
    const a = row.querySelector('.vours');
    const b = row.querySelector('.vbase');
    const head = row.querySelector('.pane.base .phead');
    head.querySelector('.pname').textContent = s.label;
    head.querySelector('.pnote').textContent = s.note;

    const v = it[+row.dataset.row] || {};
    /* Only the src changes here.  preload="metadata" on the baseline guarantees a
       loadedmetadata event on every swap, which is what the listener in bindSync
       uses to restore position; load() is deliberately not called, because it
       would restart the fetch and discard a seek already applied. */
    b.poster = s.thumb_dir + '/' + encodeURIComponent(v.name) + '.jpg';
    const next = s.src(v);
    if (!b.src.endsWith(next)) {
      b.src = next;
      // A swap during playback must keep running, not stall on the new poster.
      if (!a.paused) b.play().catch(() => {});
    }

    /* Qualitative note for this one clip.  Labelled "in this clip" on purpose:
       these are single-case observations, not the paper's measured results. */
    const text = (v.obs || {})[s.key];
    const box = row.querySelector('.deckobs');
    box.innerHTML = text ? '<b>In this clip</b>' + esc(text) : '';
    box.classList.toggle('show', !!text);
    row.querySelectorAll('.dtab').forEach(t =>
      t.classList.toggle('on', +t.dataset.si === si));
  }

  /* Ours is the clock: it owns the controls and the only audible track, and the
     baseline mirrors it.  Mirroring beats starting both by hand because the two
     elements buffer independently -- following play/pause/seek events keeps them
     from drifting apart. */
  function bindSync(row) {
    const a = row.querySelector('.vours');
    const b = row.querySelector('.vbase');
    /* Two tolerances on purpose.  Chasing a few milliseconds means seeking
       several times a second, and every seek re-decodes -- the baseline visibly
       stutters.  So correct tightly at the moments the pair can genuinely be out
       of step (a swap, a seek, a fresh play) and otherwise only step in once the
       gap passes roughly four frames, which is where it starts to show. */
    const TIGHT = 0.02, LOOSE = 0.15;
    const sync = tol => {
      // A seek before metadata arrives is discarded, so wait for readyState.
      if (b.readyState < 1 || !isFinite(a.currentTime)) return;
      /* Skip while a seek is still in flight.  Without this the pair thrashes:
         seeking re-buffers, ours advances meanwhile, canplay fires, we seek
         again -- dozens of times per swap, which is exactly the stutter the
         tolerances above are meant to avoid. */
      if (b.seeking) return;
      if (Math.abs(b.currentTime - a.currentTime) > tol) b.currentTime = a.currentTime;
    };
    const align = () => sync(TIGHT);
    /* Fires on the first load and again after every baseline swap, which is what
       restores position and playback when switching mid-clip. */
    b.addEventListener('loadedmetadata', () => {
      align();
      if (!a.paused) b.play().catch(() => {});
    });
    // A just-swapped clip needs a second nudge once it can really decode.
    b.addEventListener('canplay', align);
    a.addEventListener('play', () => { align(); b.play().catch(() => {}); });
    a.addEventListener('pause', () => b.pause());
    a.addEventListener('seeked', align);
    a.addEventListener('ratechange', () => { b.playbackRate = a.playbackRate; });
    // Steady-state drift is tiny, so the regular tick uses the loose tolerance.
    a.addEventListener('timeupdate', () => sync(LOOSE));
    a.addEventListener('ended', () => { b.pause(); align(); });
    // The baseline has no controls of its own; clicking it drives the pair.
    b.addEventListener('click', () => { a.paused ? a.play() : a.pause(); });
  }

  document.querySelectorAll('#grid .cmprow').forEach(row => {
    row.dataset.active = 0;
    bindSync(row);                   // listen before the first src is assigned
    layout(row);
  });

  document.getElementById('grid').addEventListener('click', e => {
    const row = e.target.closest('.cmprow');
    if (!row) return;
    const n = bases.length;
    const nav = e.target.closest('.dnav');
    const tab = e.target.closest('.dtab');
    let next = null;
    if (nav) next = (+row.dataset.active + +nav.dataset.d + n) % n;
    else if (tab) next = +tab.dataset.si;
    if (next === null || next === +row.dataset.active) return;
    row.dataset.active = next;
    layout(row);
  });

  /* ---- bibtex ---- */
  // Built from p.authors so the entry can never drift from the header.
  // BibTeX joins authors with " and ". Once an arXiv identifier exists, add
  // eprint / archivePrefix / primaryClass fields here.
  const bibAuthors = (p.authors || []).map(a => a.name).join(' and ');
  document.getElementById('bib').textContent = p.bibtex || `@article{ma2026motionomni,
  title   = {${p.title}},
  author  = {${bibAuthors}},
  year    = {2026}
}`;

  document.getElementById('foot').innerHTML =
    `Motion-Omni &middot; project page &middot; video samples rendered with SMPL-X (Blender Cycles)`;
});
</script>
</body>
</html>
